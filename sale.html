<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Cars</title>

<style>

body{
background:#050505;
color:white;
font-family:Montserrat,sans-serif;
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.car-card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
padding:20px;
border-radius:20px;
text-align:center;
transition:.3s;
}

.car-card:hover{
transform:translateY(-6px);
box-shadow:0 0 25px rgba(255,255,255,0.08);
}
.car-card img{
width:100%;
height:auto;
display:block;
border-radius:10px;
margin-bottom:15px;
}

.buy-btn{
display:block;
width:100%;
padding:12px;
margin-top:10px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
text-align:center;
}

.cars-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:30px;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
background:#111;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
border:1px solid #333;
z-index:1000;
transition:.3s;
}

.back-btn:hover{
background:#222;
}

  
.cart-icon{
position:fixed;
top:20px;
right:20px;
background:#111;
padding:10px 18px;
border-radius:10px;
border:1px solid #333;
font-weight:bold;
cursor:pointer;
z-index:1000;
}

.image-wrap{
position:relative;
}

.stock-badge{
position:absolute;
top:15px;
right:15px;
background:#25D366;
color:white;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

.cart-btn{
width:100%;
padding:12px;
margin-top:15px;
margin-bottom:10px;
background:#007AFF;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.cart-btn:hover{
opacity:0.9;
}


.quantity-box{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
width:100%;
padding:12px;
margin-top:15px;
margin-bottom:10px;
background:#007AFF;
border-radius:8px;
font-size:18px;
font-weight:bold;
}

.qty-btn{
width:35px;
height:35px;
border:none;
border-radius:50%;
cursor:pointer;
font-size:20px;
font-weight:bold;
}

</style>



</head>
<body>

<a href="index.html" class="back-btn">← Back</a>

<div class="cart-icon">
🛒 <span id="cartCount">0</span>
</div>  

<h1>Available Cars</h1>

<div class="cars-grid">
<div class="car-card">
<div class="image-wrap">
<img src="Sale/IMG_3047.JPG.jpg" alt="Sale Car">
<div class="stock-badge">
2 Left
</div>
</div>
<h2>Hot Wheels Mainlines</h2>
<p>AUSTIN MINI COOPER S</p>
<p><strong>Price:</strong> ₹179 Each</p>
<p><strong>Stock Available:</strong> 2 Cars</p>
<p><strong>Condition:</strong> Carded</p>
<div class="quantity-box">
<button class="qty-btn" onclick="decreaseQty()">−</button>
<span id="quantity">0</span>
<button class="qty-btn" onclick="increaseQty()">+</button>
</div>
<a href="https://wa.me/919567384351?text=Hi%20Akash,%20I'm%20interested%20in%20your%20Hot%20Wheels%20Mainlines%20(₹179%20each)." class="buy-btn">
Buy on WhatsApp
</a>
</div>










  
<div class="cars-grid">
<div class="car-card">
<div class="image-wrap">
<img src="Sale/IMG_3048.JPG.jpg" alt="Sale Car">
<div class="stock-badge">
2 Left
</div>
</div>
<h2>Hot Wheels Mainlines</h2>
<p>1983 PORSCHE 928S</p>
<p><strong>Price:</strong> ₹179 Each</p>
<p><strong>Stock Available:</strong> 2 Cars</p>
<p><strong>Condition:</strong> Carded</p>
<div class="quantity-box">
<button class="qty-btn" onclick="decreaseQty()">−</button>
<span id="quantity">0</span>
<button class="qty-btn" onclick="increaseQty()">+</button>
</div>
<a href="https://wa.me/919567384351?text=Hi%20Akash,%20I'm%20interested%20in%20your%20Hot%20Wheels%20Mainlines%20(₹179%20each)." class="buy-btn">
Buy on WhatsApp
</a>
</div>















</div>
<script>

let quantity = 0;

function increaseQty(){

quantity++;

document.getElementById("quantity").innerText = quantity;
document.getElementById("cartCount").innerText = quantity;

}

function decreaseQty(){

if(quantity > 0){

quantity--;

document.getElementById("quantity").innerText = quantity;
document.getElementById("cartCount").innerText = quantity;

}

}

</script>

</body>
</html>
