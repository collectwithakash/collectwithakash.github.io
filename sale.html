<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Cars</title>

<style>

body{
background:#050505;
color:white;
font-family:Montserrat,sans-serif;
padding:40px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.car-card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
padding:20px;
border-radius:20px;
text-align:center;
transition:.3s;
}

.car-card:hover{
transform:translateY(-6px);
box-shadow:0 0 25px rgba(255,255,255,0.08);
}
.car-card img{
width:100%;
height:auto;
display:block;
border-radius:10px;
margin-bottom:15px;
}

.buy-btn{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.cars-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:30px;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
background:#111;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
border:1px solid #333;
z-index:1000;
transition:.3s;
}

.back-btn:hover{
background:#222;
}

  
.cart-icon{
position:fixed;
top:20px;
right:20px;
background:#111;
padding:10px 18px;
border-radius:10px;
border:1px solid #333;
font-weight:bold;
cursor:pointer;
z-index:1000;
}

.image-wrap{
position:relative;
}

.stock-badge{
position:absolute;
top:15px;
right:15px;
background:#25D366;
color:white;
padding:8px 14px;
border-radius:30px;
font-size:12px;
font-weight:bold;
}

.cart-btn{
width:100%;
padding:12px;
margin-top:15px;
margin-bottom:10px;
background:#007AFF;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.cart-btn:hover{
opacity:0.9;
}
  
</style>



</head>
<body>

<a href="index.html" class="back-btn">← Back</a>

<div class="cart-icon">
🛒 <span id="cartCount">0</span>
</div>  

<h1>Available Cars</h1>

<div class="cars-grid">

<div class="car-card">

<div class="image-wrap">
<img src="Sale/IMG_8329 (Sale).JPG" alt="Sale Car">

<div class="stock-badge">
2 Left
</div>
</div>

<h2>Hot Wheels Mainlines</h2>

<h3>Included Cars</h3>

<p>1. 1983 Porsche 928S</p>
<p>2. 1968 Shelby GT500 (Sold)</p>
<p>3. 1983 Porsche 928S</p>

<p><strong>Price:</strong> ₹179 Each</p>

<p><strong>Stock Available:</strong> 2 Cars</p>

<p><strong>Condition:</strong> Carded</p>

<button class="cart-btn" onclick="addToCart()">
Add to Cart
</button>

<a href="https://wa.me/919567384351?text=Hi%20Akash,%20I'm%20interested%20in%20your%20Hot%20Wheels%20Mainlines%20(₹179%20each)." class="buy-btn">
Buy on WhatsApp
</a>

</div>

</div>

<script>

let count = 0;

function addToCart(){
count++;
document.getElementById("cartCount").innerText = count;
}

</script>

</body>
</html>
